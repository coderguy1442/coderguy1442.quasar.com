<!DOCTYPE html>
<html>
<head>
  <title>QUASAR CHAOS SYSTEM 💥📱</title>

  <style>
    body {
      margin: 0;
      background: black;
      color: #00ff9f;
      font-family: monospace;
      text-align: center;
      overflow: hidden;
    }

    h1 {
      text-shadow: 0 0 10px #00ff9f;
    }

    .box {
      border: 1px solid #00ff9f;
      padding: 10px;
      margin: 10px auto;
      width: 300px;
      box-shadow: 0 0 10px #00ff9f;
    }

    img {
      width: 200px;
      transition: all 0.3s ease;
    }

    .explode {
      animation: explode 0.6s forwards;
    }

    @keyframes explode {
      0% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.5) rotate(10deg); filter: brightness(3); }
      100% { transform: scale(0) rotate(720deg); opacity: 0; }
    }

    button {
      background: black;
      color: #00ff9f;
      border: 1px solid #00ff9f;
      padding: 10px;
      margin: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #00ff9f;
      color: black;
    }

  </style>
</head>

<body>

<h1>QUASAR CHAOS LAB 💚💥</h1>

<div class="box" id="note2Box">
  <p>📱 NOTE II</p>
  <img id="note2Img" src="https://commons.wikimedia.org/wiki/Special:FilePath/Samsung%20Galaxy%20Note%20II.png">
</div>

<div class="box" id="note7Box">
  <p>💣 NOTE 7</p>
  <img id="note7Img" src="https://commons.wikimedia.org/wiki/Special:FilePath/Samsung%20Galaxy%20Note%207.png">
</div>

<button onclick="explodeNote2()">BOOM NOTE II 🔊</button>
<button onclick="explodeNote7()">BOOM NOTE 7 💣</button>
<button onclick="resetAll()">RESET 🔄</button>

<!-- SOUND -->
<audio id="boomSound">
  <source src="https://www.soundjay.com/explosion/sounds/explosion-01.mp3" type="audio/mpeg">
</audio>

<script>

function playBoom() {
  let sound = document.getElementById("boomSound");
  sound.currentTime = 0;
  sound.play();
}

function explodeNote2() {
  playBoom();
  let img = document.getElementById("note2Img");
  img.classList.add("explode");
}

function explodeNote7() {
  playBoom();
  let img = document.getElementById("note7Img");
  img.classList.add("explode");
}

function resetAll() {
  document.getElementById("note2Img").classList.remove("explode");
  document.getElementById("note7Img").classList.remove("explode");
}

</script>

</body>
</html>
